<div id="text1" class="copyright"></div>

<script>
    const params = new URLSearchParams(window.location.search);
const user = params.get("user");

if (user) {
    const userScript = document.createElement("script");
    userScript.src = `/script/users/${encodeURIComponent(user)}.js`;

    userScript.onload = () => {
        const profilScript = document.createElement("script");
        profilScript.src = "/script/users/profil.js";
        document.body.appendChild(profilScript);
    };

    userScript.onerror = () => {
        console.log("User tidak ditemukan.");
    };

    document.body.appendChild(userScript);
}
</script>
<script src="/script/halaman-utama.js"></script>
