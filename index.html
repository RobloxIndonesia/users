<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Username - Roblox Indonesia</title>

<link rel="stylesheet" href="/style/halaman-utama.css">
<style>
.search1{
    padding:15px;
    background:#fff;
    border-bottom:1px solid #ddd;
}

.search1 h2{
    margin:0 0 10px;
}

.search1 input{
    width:100%;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.user{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px;
    background:#fff;
    border-bottom:1px solid #eee;
}

.user .img{
    width:70px;
    height:70px;
    border-radius:50%;
}
.user h3 img{
    width:15px;
    height:15px;
}

.info h3{
    margin:0;
}

.info p{
    margin:4px 0;
    color:#666;
}
</style>

</head>
<body>

<div class="header">
<div class="header1">
    <button class="menu-btn" onclick="openMenu()">☰</button>
    
     <div id="logo1"></div>

     <div class="right-icons">
         <div id="profiles"></div>
         <div class="search">⌕</div>
     </div>
</div>     
     
<!-- Nav -->
<div class="nav">
    <a id="link1"></a>
    <a id="link2"></a>
    <a id="link3"></a>
    <a id="link4"></a>
</div>
</div>

<div id="menuDropdown" class="sidebar">
    <div class="close-btn1">
    <div id="logo2"></div>
    <span class="close-btn" onclick="closeMenu()">×</span>
    </div>
    <a id="link9"></a>
    <a id="link10"></a>
    <a id="link11"></a>
    <a id="link12"></a>
    <a id="link13"></a>
    <a id="link14"></a>
    <a id="link15"></a>
    <a id="link16"></a>
</div>

<br>
<br>
<br>
<br>

<div class="search1">
<h2>Pencarian Pengguna</h2>

<input type="text" id="search" placeholder="Cari pengguna">
<div id="hasil"></div></div>

<div class="content"></div>
    
<div class="footer-links">
    <a id="link5"></a>
    <a id="link6"></a>
    <a id="link7"></a>
    <a id="link8"></a>
</div>

<hr>

<div id="text1" class="copyright"></div>
<div id="text2" class="copyright"></div>

<script src="/script/halaman-utama.js"></script>

<script>
const users = [];
</script>

<script src="/script/search/search1.js"></script>
<script src="/script/search/search2.js"></script>
<script src="/script/search/search3.js"></script>

<script>
const hasil = document.getElementById("hasil");

let semuaUser = [];
let jumlahTampil = 20; // tampil pertama
const perLoad = 20;    // tambah setiap scroll

// Urutkan A-Z
users.sort((a, b) =>
    a.displayName.localeCompare(b.displayName, "id", {
        sensitivity: "base"
    })
);

semuaUser = users;

function tampil(data, reset = true) {
    if (reset) hasil.innerHTML = "";

    data.forEach(user => {
        hasil.innerHTML += `
        <a href="/users/profil.html?user=${user.username}" style="text-decoration:none;color:black;">
            <div class="user">
                <img class="img" src="${user.avatar}" width="70">
                <div class="info">
                    <h3>
                        ${user.displayName}
                        <img src="${user.certified}">
                        <img src="${user.plus}">
                    </h3>
                    <p>${user.username}</p>
                </div>
            </div>
        </a>
        `;
    });
}

function tampilAwal() {
    hasil.innerHTML = "";
    tampil(semuaUser.slice(0, jumlahTampil), false);
}

tampilAwal();

// Scroll otomatis tambah data
window.addEventListener("scroll", () => {
    if (
        window.innerHeight + window.scrollY >=
        document.body.offsetHeight - 100
    ) {
        if (jumlahTampil < semuaUser.length) {
            const lama = jumlahTampil;
            jumlahTampil += perLoad;
            tampil(semuaUser.slice(lama, jumlahTampil), false);
        }
    }
});

// Pencarian
document.getElementById("search").addEventListener("input", function () {

    const cari = this.value.toLowerCase();

    semuaUser = users.filter(user =>
        user.displayName.toLowerCase().includes(cari) ||
        user.username.toLowerCase().includes(cari)
    );

    jumlahTampil = 20;
    tampilAwal();

});
</script>
</body>
</html>
